<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
  <title id="title">Section Assignment Distribution (~80 Shifts Reviewed)</title>
  <desc id="desc">Horizontal bars show Main Room 2, Pavilion 50, Mezzanine 20, and Other or Float 8.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172033; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #64748B; }
    .axis { font-size: 13px; fill: #64748B; }
    .label { font-size: 14px; font-weight: 600; }
    .value { font-size: 14px; font-weight: 700; }
  </style>
<text x="40" y="50" class="title">Section Assignment Distribution (~80 Shifts Reviewed)</text>
<text x="40" y="78" class="subtitle">Counts transcribed from the supplied example chart</text>
<line x1="170.0" y1="100" x2="170.0" y2="425" stroke="#DCE3EC" stroke-width="1"/>
<text x="170.0" y="455" class="axis" text-anchor="middle">0</text>
<line x1="300.0" y1="100" x2="300.0" y2="425" stroke="#DCE3EC" stroke-width="1"/>
<text x="300.0" y="455" class="axis" text-anchor="middle">10</text>
<line x1="430.0" y1="100" x2="430.0" y2="425" stroke="#DCE3EC" stroke-width="1"/>
<text x="430.0" y="455" class="axis" text-anchor="middle">20</text>
<line x1="560.0" y1="100" x2="560.0" y2="425" stroke="#DCE3EC" stroke-width="1"/>
<text x="560.0" y="455" class="axis" text-anchor="middle">30</text>
<line x1="690.0" y1="100" x2="690.0" y2="425" stroke="#DCE3EC" stroke-width="1"/>
<text x="690.0" y="455" class="axis" text-anchor="middle">40</text>
<line x1="820.0" y1="100" x2="820.0" y2="425" stroke="#DCE3EC" stroke-width="1"/>
<text x="820.0" y="455" class="axis" text-anchor="middle">50</text>
<text x="150" y="140" class="label" text-anchor="end">Main Room</text>
<rect x="170" y="115" width="26.0" height="40" rx="7" fill="#2563EB"/>
<text x="208.0" y="141" class="value">2</text>
<text x="150" y="216" class="label" text-anchor="end">Pavilion</text>
<rect x="170" y="191" width="650.0" height="40" rx="7" fill="#2563EB"/>
<text x="832.0" y="217" class="value">50</text>
<text x="150" y="292" class="label" text-anchor="end">Mezzanine</text>
<rect x="170" y="267" width="260.0" height="40" rx="7" fill="#2563EB"/>
<text x="442.0" y="293" class="value">20</text>
<text x="150" y="368" class="label" text-anchor="end">Other/Float</text>
<rect x="170" y="343" width="104.0" height="40" rx="7" fill="#2563EB"/>
<text x="286.0" y="369" class="value">8</text>
<line x1="170" y1="425" x2="820" y2="425" stroke="#132238" stroke-width="1.5"/>
<text x="495" y="500" class="axis" text-anchor="middle">Number of assignments shown</text>
</svg>
